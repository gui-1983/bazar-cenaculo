name: Manter Supabase ativo

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1,4"

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Consultar o Supabase (mantém o projeto acordado)
        run: |
          echo "Fazendo ping no Supabase..."

          curl -sS -o /dev/null -w "Resposta HTTP: %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/categorias?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"

          echo "Concluído."
